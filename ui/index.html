<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeVision Studio</title>
<style>
:root{--bg:#111820;--panel:#18232e;--panel2:#202d39;--line:#30404e;--text:#e7edf3;--muted:#91a1af;--blue:#1688d4;--cyan:#43c7db;--green:#4bc49a;--red:#e06868}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px "Segoe UI",Tahoma,sans-serif;height:100vh;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:76px 1fr}.rail{background:#0c1218;border-left:1px solid var(--line);display:flex;align-items:center;flex-direction:column;gap:10px;padding:16px 8px}.brand{width:42px;height:42px;border-radius:12px;background:var(--blue);display:grid;place-items:center;font-weight:bold;font-size:18px;margin-bottom:18px}.rail button{width:48px;height:44px;background:transparent;border:0;color:var(--muted);border-radius:9px;font-size:18px;cursor:pointer}.rail button.active,.rail button:hover{background:#1f3446;color:white}.main{min-width:0;display:grid;grid-template-rows:56px minmax(0,1fr) 260px}.top{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:#141d26}.top strong{font-size:16px}.top .spacer{flex:1}.btn{background:var(--blue);border:0;border-radius:7px;color:white;padding:9px 13px;cursor:pointer;font-weight:600}.btn.secondary{background:#263746;border:1px solid var(--line)}.work{min-height:0;display:grid;grid-template-columns:minmax(420px,1.3fr) minmax(360px,.9fr);gap:12px;padding:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}.video-card{display:grid;grid-template-rows:minmax(0,1fr) 52px}.video-stage{background:#070a0d;display:grid;place-items:center;position:relative;min-height:0}.video-stage video{width:100%;height:100%;object-fit:contain}.placeholder{position:absolute;color:var(--muted);text-align:center;pointer-events:none}.video-controls{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#18232e}.video-controls input[type=range]{flex:1}.side{display:grid;grid-template-rows:48px 1fr;min-height:0}.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);font-weight:700}.code{width:100%;height:100%;resize:none;border:0;outline:0;background:#10171e;color:#d7e9d9;padding:16px;font:13px/1.6 Consolas,monospace;direction:ltr;text-align:left}.bottom{display:grid;grid-template-rows:44px 120px 1fr;border-top:1px solid var(--line);background:#141d26;min-height:0}.timeline-head{display:flex;align-items:center;gap:12px;padding:0 16px}.wave{height:120px;margin:0 16px;background:#101820;border:1px solid var(--line);border-radius:7px;position:relative;overflow:hidden;cursor:pointer}.wave canvas{width:100%;height:100%}.playhead{position:absolute;top:0;bottom:0;width:2px;background:#fa5959;pointer-events:none}.segments{display:flex;gap:7px;overflow:auto;padding:8px 16px}.segment{min-width:170px;max-width:240px;background:#273541;border:1px solid #3c4b58;border-radius:6px;padding:9px;cursor:pointer;white-space:normal}.segment.active{background:#086ba9;border-color:#42a6e5}.segment time{display:block;color:#afc8d9;font-size:11px;margin-bottom:4px}.segment input{width:100%;background:transparent;border:0;color:white;outline:none}.status{color:var(--muted);font-size:12px}.hidden{display:none}#file,#transcript{display:none}
@media(max-width:900px){.app{grid-template-columns:54px 1fr}.work{grid-template-columns:1fr;grid-template-rows:45vh 35vh;overflow:auto}.main{grid-template-rows:56px 1fr 240px}.bottom{grid-template-rows:38px 85px 1fr}.wave{height:85px}.side{grid-template-rows:40px 1fr}}
</style>
<style>
/* Visual language aligned with ai_model_studio/web: airy surfaces, cyan/mint, Cairo-style RTL. */
:root{--bg:#f4f7fb;--panel:rgba(255,255,255,.82);--panel2:#eef5f8;--line:rgba(148,163,184,.2);--text:#0f172a;--muted:#71819a;--blue:#0284c7;--cyan:#06b6d4;--green:#10b981}
body{background-color:#f4f7fb;background-image:radial-gradient(ellipse 90% 45% at 50% -7%,rgba(14,165,233,.12),transparent 72%),radial-gradient(ellipse 60% 45% at 100% 45%,rgba(95,216,196,.09),transparent 65%);color:#0f172a;font-family:Cairo,Tahoma,sans-serif}
.app{grid-template-columns:258px minmax(0,1fr)}
.rail{grid-column:1;grid-row:1;background:rgba(255,255,255,.76);backdrop-filter:blur(24px);border:0;border-left:1px solid rgba(255,255,255,.9);box-shadow:3px 0 28px rgba(15,23,42,.04);padding:22px 16px;align-items:stretch;gap:6px}
.brand{width:44px;height:44px;margin:0 5px 18px;border-radius:14px;background:linear-gradient(145deg,#ecfeff,#e0f2fe);border:1px solid rgba(6,182,212,.18);color:#0284c7;box-shadow:inset 0 1px 0 #fff}
.rail button{width:auto;height:44px;text-align:right;padding:0 14px;border-radius:11px;color:#627188;font-size:14px}.rail button::after{margin-right:12px;font-size:12px}.rail button:nth-of-type(1)::after{content:'مساحة العمل'}.rail button:nth-of-type(2)::after{content:'الفيديو'}.rail button:nth-of-type(3)::after{content:'التفريغ الصوتي'}.rail button:nth-of-type(4)::after{content:'الشيفرة'}.rail button:nth-of-type(5)::after{content:'التصدير'}.rail button.active,.rail button:hover{background:linear-gradient(110deg,rgba(6,182,212,.12),rgba(56,189,248,.06));color:#036a8f;border:1px solid rgba(6,182,212,.11)}
.main{grid-column:2;grid-row:1;background:transparent;grid-template-rows:63px minmax(0,1fr) 260px;min-width:0}
.top{background:rgba(248,250,252,.72);backdrop-filter:blur(19px);border-bottom:1px solid rgba(203,213,225,.34);padding:0 clamp(20px,3vw,42px);color:#0f172a}.top strong{font-size:17px;font-weight:900}.card{background:rgba(255,255,255,.82);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.92);box-shadow:inset 0 1px 0 #fff,0 12px 35px -18px rgba(15,23,42,.17);border-radius:18px}.video-stage{background:#0f172a}.video-controls,.bottom{background:rgba(255,255,255,.7);color:#0f172a}.video-controls{border-top:1px solid var(--line)}.btn{background:linear-gradient(135deg,#0284c7,#06a6b8);border-radius:10px;box-shadow:0 8px 18px rgba(2,132,199,.14)}.btn.secondary{background:rgba(241,245,249,.9);border:1px solid rgba(203,213,225,.65);box-shadow:none;color:#586981}.section-head,.timeline-head{color:#15233a}.section-head{border-color:var(--line)}.code{background:#101722;color:#d8e9df;border-radius:0 0 17px 17px}.bottom{border-top:1px solid rgba(203,213,225,.45)}.wave{background:#e9f2f7;border-color:rgba(148,163,184,.25)}.segment{background:#f1f5f9;border-color:#dbe4ec;color:#334155}.segment.active{background:#e0f2fe;border-color:#38bdf8;color:#075985}.segment input{color:inherit}.segment time{color:#71819a}.status{color:#71819a}
@media(max-width:900px){.app{grid-template-columns:56px minmax(0,1fr)}.rail{padding:12px 5px}.rail button{text-align:center;padding:0}.rail button::after{display:none}.main{grid-column:2}.brand{margin:0 auto 16px}}
</style></head>
<body><div class="app">
<nav class="rail"><div class="brand">CV</div><button class="active" title="المشروع">⌂</button><button title="الفيديو">▶</button><button title="التفريغ">≋</button><button title="الشيفرة">{ }</button><button title="التصدير">⇩</button></nav>
<main class="main"><header class="top"><strong>CodeVision Studio</strong><span class="status" id="projectName">لا يوجد فيديو مفتوح</span><span class="spacer"></span><button class="btn secondary" id="loadTranscript">استيراد التفريغ</button><button class="btn secondary" id="runExtraction">تشغيل الاستخراج</button><button class="btn" id="openVideo">فتح فيديو</button><input id="file" type="file" accept="video/*"><input id="transcript" type="file" accept="application/json,.json"></header>
<section class="work"><div class="card video-card"><div class="video-stage"><video id="video" controls></video><div class="placeholder" id="placeholder">افتح فيديو تعليمي لبدء المراجعة<br><small>المعالجة تتم محليًا في جهازك</small></div></div><div class="video-controls"><button class="btn secondary" id="play">▶ تشغيل</button><span id="clock">00:00 / 00:00</span><span class="status" id="videoStatus">جاهز</span></div></div>
<div class="card side"><div class="section-head"><span>الشيفرة المستعادة</span><select id="scriptSelect" class="btn secondary"><option value="">ملفات المشروع</option></select><button class="btn secondary" id="saveCode">حفظ TXT</button></div><textarea class="code" id="code" spellcheck="false" placeholder="استورد تفريغًا أو الصق الشيفرة المستعادة هنا..."></textarea></div></section>
<section class="bottom"><div class="timeline-head"><b>المسار الزمني</b><span class="status" id="segmentCount">0 مقطع</span><span class="spacer"></span><span class="status"><span id="jobStatus">موجة الصوت من الفيديو</span> <span id="jobProgress"></span></span></div><div class="wave" id="wave"><canvas id="waveCanvas"></canvas><div class="playhead" id="playhead"></div></div><div class="segments" id="segments"><span class="status">استورد transcript.json الناتج من المحرك لعرض المقاطع هنا.</span></div></section>
</main></div>
<script>
const $=id=>document.getElementById(id),video=$('video'),file=$('file'),trfile=$('transcript');let parts=[],objectUrl=null,activeJob=null,pollTimer=null;
function fmt(s){if(!Number.isFinite(s))s=0;let m=Math.floor(s/60),r=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0')}
function seek(t){video.currentTime=Math.max(0,Math.min(t,video.duration||t));video.play().catch(()=>{});renderSegments()}
function renderSegments(){ $('segments').innerHTML='';parts.forEach((p,i)=>{let b=document.createElement('div');b.className='segment'+(video.currentTime>=p.start_sec&&video.currentTime<=p.end_sec?' active':'');let tm=document.createElement('time');tm.textContent=fmt(p.start_sec)+' – '+fmt(p.end_sec);let inp=document.createElement('input');inp.value=p.text||'';inp.setAttribute('aria-label','نص المقطع');inp.addEventListener('input',()=>p.text=inp.value);b.append(tm,inp);b.addEventListener('click',e=>{if(e.target!==inp)seek(p.start_sec)});$('segments').append(b)});$('segmentCount').textContent=parts.length+' مقطع'}
function drawWave(data){let c=$('waveCanvas'),box=$('wave').getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=box.width*dpr;c.height=box.height*dpr;let x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,box.width,box.height);x.strokeStyle='#43c7db';x.globalAlpha=.75;x.beginPath();let step=Math.max(1,Math.floor(data.length/box.width));for(let i=0;i<box.width;i++){let max=0;for(let j=i*step;j<Math.min(data.length,(i+1)*step);j++)max=Math.max(max,Math.abs(data[j]));let h=max*box.height*.82;x.moveTo(i,box.height/2-h/2);x.lineTo(i,box.height/2+h/2)}x.stroke();x.globalAlpha=1}
async function audioWave(blob){try{let ctx=new AudioContext(),buf=await ctx.decodeAudioData(await blob.arrayBuffer()),a=buf.getChannelData(0);drawWave(a);ctx.close()}catch{ $('videoStatus').textContent='تعذر تحليل الموجة الصوتية'}}
$('openVideo').onclick=()=>file.click();file.onchange=()=>{let f=file.files[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);video.src=objectUrl;$('projectName').textContent=f.name;$('placeholder').classList.add('hidden');$('videoStatus').textContent='تم فتح الفيديو محليًا';video.onloadedmetadata=()=>{$('clock').textContent='00:00 / '+fmt(video.duration);audioWave(f)};video.ontimeupdate=()=>{let d=video.duration||0;$('clock').textContent=fmt(video.currentTime)+' / '+fmt(d);$('playhead').style.left=(d?100*video.currentTime/d:0)+'%';renderSegments()}};
$('play').onclick=()=>video.paused?video.play():video.pause();$('loadTranscript').onclick=()=>trfile.click();trfile.onchange=async()=>{let f=trfile.files[0];if(!f)return;try{let d=JSON.parse(await f.text());parts=(d.segments||[]).map(s=>({start_sec:Number(s.start_sec??s.start??0),end_sec:Number(s.end_sec??s.end??0),text:s.text||''}));renderSegments();if(d.code) $('code').value=d.code;$('videoStatus').textContent='تم استيراد '+parts.length+' مقطع'}catch{$('videoStatus').textContent='ملف JSON غير صالح'}};
$('wave').onclick=e=>{if(!video.duration)return;let r=$('wave').getBoundingClientRect();seek((e.clientX-r.left)/r.width*video.duration)};$('saveCode').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('code').value],{type:'text/plain'}));a.download='reconstructed_code.txt';a.click();URL.revokeObjectURL(a.href)};
runExtraction.onclick=async()=>{let f=file.files[0];if(!f){jobStatus.textContent='اختر فيديو أولًا';return} jobStatus.textContent='جارٍ الرفع…';runExtraction.disabled=true;try{let r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Video-Name':encodeURIComponent(f.name)},body:f});let j=await r.json();if(!r.ok)throw Error(j.error);activeJob=j.id;jobStatus.textContent='جارٍ الاستخراج';pollTimer=setInterval(pollJob,1800)}catch(e){jobStatus.textContent='فشل: '+e.message;runExtraction.disabled=false}};
async function pollJob(){try{let j=await (await fetch('/api/jobs/'+activeJob)).json();jobProgress.textContent=j.status;videoStatus.textContent=j.log||'';if(j.transcript?.segments){parts=j.transcript.segments;renderSegments()}if(j.scripts?.length){let q=scriptSelect;q.innerHTML='<option value=">اختر ملفًا</option>';j.scripts.forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;q.appendChild(o)})}if(['completed','failed'].includes(j.status)){runExtraction.disabled=false;clearInterval(pollTimer);jobStatus.textContent=j.status==='completed'?'اكتمل الاستخراج':'فشل الاستخراج'}}catch{}}
scriptSelect.onchange=async()=>{let v=scriptSelect.value;if(v&&activeJob){let r=await fetch('/api/files/'+encodeURIComponent(activeJob+'/results/'+v));if(r.ok)code.value=await r.text()}};
window.addEventListener('resize',()=>{if(video.src)audioWave(file.files[0])});
</script></body></html>
